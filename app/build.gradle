plugins {
    id 'com.android.application'
    id 'com.google.firebase.crashlytics'
    id 'com.google.gms.google-services'
 // id 'kotlin-android-extensions'
}

android {
    signingConfigs {
        release {
        }
    }
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.creatrix.salessolution"
        minSdkVersion 23
        targetSdkVersion 33
        versionCode 13
        versionName "1.9.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        signingConfig signingConfigs.debug
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    buildFeatures {
        viewBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.firebase:firebase-crashlytics:18.4.3'
    implementation 'com.google.firebase:firebase-analytics:21.3.0'
    implementation 'com.google.firebase:firebase-messaging:23.2.1'

    implementation 'com.github.bumptech.glide:glide:4.14.2'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.14.2'
    //implementation 'com.toptoche.searchablespinner:searchablespinnerlibrary:1.3.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'com.squareup.retrofit2:converter-gson:2.6.0'
    implementation 'com.bignerdranch.android:expandablerecyclerview:1.0.3'
    implementation "androidx.cardview:cardview:1.0.0"

    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.github.baoyachi:StepView:1.9'
    implementation 'com.github.dewinjm:monthyear-picker:1.0.2'
    //implementation 'com.ismaeldivita.chipnavigation:chip-navigation-bar:1.3.4'
    implementation 'com.github.ismaeldivita:chip-navigation-bar:1.4.0'
    implementation "androidx.core:core-ktx:1.10.1"
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10'


    implementation 'com.github.miteshpithadiya:SearchableSpinner:master'

    implementation 'com.github.pratikbutani:MultiSelectSpinner:1.0.1'
    implementation 'com.github.dhaval2404:imagepicker:2.1'
    implementation 'id.zelory:compressor:2.1.1'

    implementation 'com.github.abumoallim:Android-Multi-Select-Dialog:v1.9'
    implementation 'com.karumi:dexter:6.2.3'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.karumi:dexter:6.2.3'
    implementation 'com.github.hsmnzaydn:imagezoom:1.5.0'
    //lottie
    implementation 'com.airbnb.android:lottie:4.2.1'
    implementation 'joda-time:joda-time:2.9.4'
    implementation 'com.github.mahimrocky:ShowMoreText:1.0.2'
    implementation 'androidx.work:work-runtime:2.7.1'

  //implementation 'com.github.npanigrahy:Custom-Calendar-View:v1.0'
    implementation 'com.github.prolificinteractive:material-calendarview:2.0.1'
    implementation 'com.jakewharton.threetenabp:threetenabp:1.2.0'

}